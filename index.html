<!doctype html>
<html lang="ja"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6f8069" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<title>ARたいようけい / AR Solar System</title></head>
<body>
<header class="top"><h1 data-t="app"></h1>
  <div class="switches"><button id="big" class="chip" aria-pressed="false" data-t="big"></button><button id="lang" class="chip">English</button></div></header>
<main id="home">
  <p class="lead" data-t="lead"></p>
  <button id="ar" class="primary" data-t="ar"></button>
  <div id="msg" class="msg" hidden></div>
  <p class="small" data-t="or"></p>
</main>
<div id="view"></div>
<div id="overlay">
  <div class="hint" id="hint"></div>
  <div class="fact" id="fact" hidden><b id="fname"></b><ul id="flist"></ul><button id="fclose">×</button></div>
  <div class="bar">
    <label class="slider"><span data-t="size"></span><input id="scale" type="range" min="0.3" max="3" step="0.05" value="1"></label>
    <label class="slider"><span data-t="speed"></span><input id="speed" type="range" min="0" max="4" step="0.1" value="1"></label>
    <button id="move" data-t="move" hidden></button>
    <button id="exit" data-t="exit" hidden></button>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body></html>
